[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.risk_agent_bank.metadata]
type = "agent"

[project]
name = "risk_agent_bank"
version = "0.1.0"
authors = [
  { name="Abhishek Abhishek Sharma", email="abhishek.sharma@solace.com" },
]
description = "Analyzes customer history and transactions to detect possible fraud."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "solace_agent_mesh~=1.0.2",
    # Add plugin-specific dependencies here
]

[tool.hatch.build.targets.wheel]
packages = ["src/risk_agent_bank"]
src-path = "src"

[tool.hatch.build.targets.wheel.force-include]
"src/risk_agent_bank" = "risk_agent_bank/"
"config.yaml" = "risk_agent_bank/config.yaml"
"README.md" = "risk_agent_bank/README.md"
"pyproject.toml" = "risk_agent_bank/pyproject.toml"
